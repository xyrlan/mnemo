name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python-version: ['3.8', '3.9', '3.10', '3.11', '3.12']

    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - name: Unit tests
        run: pytest tests/unit/ -v
      - name: Integration tests
        run: pytest tests/integration/ -v
      - name: E2E tests
        run: pytest tests/e2e/ -v
      - name: Coverage gate
        # pytest-cov writes the parent's data under a parallel name
        # (`.coverage.<host>.<pid>.<rand>`) and combines everything matching
        # `.coverage.*` at the end. A data file written without `branch = true`
        # aborts that combine with "Can't combine statement coverage data with
        # branch data" — reported as a coverage failure even when every test
        # passed. On py3.8 such a file appears *during* the run (the step used
        # to confirm the directory was clean beforehand), so a subprocess is
        # starting its own coverage.
        #
        # `branch = true` lives in pyproject.toml, which coverage finds by
        # walking up from the *current* directory — so a child started with a
        # different cwd silently falls back to statement-only. COVERAGE_RCFILE
        # travels through the environment instead, which every child inherits
        # regardless of where it runs.
        env:
          COVERAGE_RCFILE: ${{ github.workspace }}/pyproject.toml
          COVERAGE_DEBUG: process
          COVERAGE_DEBUG_FILE: ${{ runner.temp }}/coverage-debug.log
        run: |
          coverage erase || true
          rc=0
          pytest --cov=mnemo --cov-report=term-missing --cov-fail-under=85 tests/ || rc=$?
          echo "--- processes that started coverage ---"
          grep -E "New process|cwd is now" "$RUNNER_TEMP/coverage-debug.log" 2>/dev/null \
            | sort -u | head -40 || echo "(no coverage process log)"
          exit $rc

  npm-wrapper:
    name: npm wrapper (node 20)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      # These ran only inside the release job, which is gated behind
      # `needs: publish-pypi` — so a wrapper regression surfaced *after* PyPI
      # had already published, leaving the two registries on different versions.
      - name: npm tests
        working-directory: npm
        run: npm test

  binary-canary:
    name: standalone binary builds (linux-x64)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      # The full four-platform matrix runs only on a tag, which would repeat
      # the mistake this workflow just fixed for npm: a build break discovered
      # mid-release, after PyPI has already published. The failures that
      # actually happen here — a bad spec, a missing hiddenimport, uncollected
      # templates — are all platform-independent, so one Linux build on every
      # PR catches them for a fraction of the matrix's cost.
      - name: Build
        run: pyinstaller tools/mnemo.spec --distpath dist/bin --workpath build/pyi --noconfirm
      # Both failure modes below are silent at build time: PyInstaller happily
      # produces a binary that cannot scaffold a vault, or that crashes the
      # moment Claude Code dispatches a hook.
      - name: Smoke test
        run: |
          BIN="$GITHUB_WORKSPACE/dist/bin/mnemo/mnemo"
          "$BIN" --version
          mkdir -p /tmp/smoke && cd /tmp/smoke && git init -q .
          "$BIN" init --project --yes --quiet
          test -f .mnemo/HOME.md || { echo "::error::templates missing from the bundle"; exit 1; }
          "$BIN" status | grep -q '4/4' || { echo "::error::hooks not recognised in binary form"; exit 1; }
          echo '{"session_id":"ci","cwd":"/tmp/smoke","prompt":"a test prompt for the reflex"}' \
            | "$BIN" hook user_prompt_submit || { echo "::error::hook dispatch failed"; exit 1; }

  generated-files:
    name: generated manifests are current
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      # plugin.json drifted two minors behind and marketplace.json twelve,
      # because regenerating them was a manual step in the release commit.
      - name: Regenerate and diff
        run: |
          python3 tools/sync_npm_version.py
          python3 tools/sync_plugin_manifest.py
          git diff --exit-code -- .claude-plugin/ npm/package.json npm/lib/bootstrap.js \
            || { echo "::error::Generated files are stale. Run tools/sync_npm_version.py and tools/sync_plugin_manifest.py, then commit."; exit 1; }

  windows-experimental:
    name: windows-latest / py3.11 (experimental)
    runs-on: windows-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
      - run: pytest tests/unit/ -v
