name: Release

on:
  push:
    tags: ["v*"]
  # Build the binaries without publishing anything, so a runner or toolchain
  # problem can be found without burning a version number. Publishing is
  # guarded on the ref being a tag, so a manual run can never release.
  workflow_dispatch:

# Ordering matters here, and it is deliberate.
#
# Publishing to PyPI and npm is irreversible: a version number, once taken,
# can never be reused. Building four platform binaries is the fallible step --
# it depends on runners, toolchains, and per-OS shell differences. So the
# fallible work runs FIRST and the irreversible work is gated behind it.
#
# v0.17.0 is why. PyPI and npm both published, then the Windows binary job
# failed on a missing `shasum`, and the release shipped with no binaries at
# all -- which is precisely what the plugin install needs.
jobs:
  publish-pypi:
    name: Publish to PyPI
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build-binaries
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for trusted publishing (optional alt to API token)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  build-binaries:
    name: Binary — ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      target: darwin-arm64 }
          # macos-15-intel, not macos-13: the latter is on its way out and its
          # runners no longer get picked up — the job sat queued indefinitely
          # on two consecutive releases, blocking the publish jobs behind it.
          # PyInstaller cannot cross-compile, so an Intel build needs an Intel
          # runner; there is no arm64 substitute.
          - { os: macos-15-intel, target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Build (onedir — see tools/mnemo.spec for why not onefile)
        run: pyinstaller tools/mnemo.spec --distpath dist/bin --workpath build/pyi --noconfirm

      # Smoke-test before publishing: a binary that cannot scaffold a vault is
      # worse than no binary, and `init` is what exercises the bundled
      # templates that PyInstaller has to collect explicitly.
      - name: Smoke test
        shell: bash
        run: |
          BIN=dist/bin/mnemo/mnemo
          [ "${{ runner.os }}" = "Windows" ] && BIN=dist/bin/mnemo/mnemo.exe
          "$BIN" --version
          mkdir -p /tmp/smoke && cd /tmp/smoke && git init -q .
          "$GITHUB_WORKSPACE/$BIN" init --project --yes --quiet
          "$GITHUB_WORKSPACE/$BIN" status
          test -f .mnemo/HOME.md || { echo "::error::templates missing from the bundle"; exit 1; }

      - name: Package
        shell: bash
        run: |
          cd dist/bin
          # On a manual run ref_name is a branch, which can contain "/" and
          # would produce a broken filename. Only tags name a real release.
          case "${{ github.ref }}" in
            refs/tags/*) LABEL="${{ github.ref_name }}" ;;
            *)           LABEL="dev" ;;
          esac
          ASSET="mnemo-$LABEL-${{ matrix.target }}.tar.gz"
          tar -czf "$ASSET" mnemo
          # Python rather than shasum/sha256sum: neither is guaranteed in the
          # Git Bash that GitHub runs `shell: bash` under on Windows, and the
          # missing one there failed the whole release. Python is set up by
          # this job already, so it is the one tool present on every target.
          # Format matches `shasum -a 256` output, which bin/launch parses.
          python -c "
          import hashlib, sys
          p = sys.argv[1]
          print(f'{hashlib.sha256(open(p, \"rb\").read()).hexdigest()}  {p}')
          " "$ASSET" > "$ASSET.sha256"
          cat "$ASSET.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/bin/*.tar.gz
            dist/bin/*.sha256

  publish-binaries:
    name: Attach binaries to the release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --title "${{ github.ref_name }}" --generate-notes --repo "$GITHUB_REPOSITORY" || gh release upload "${{ github.ref_name }}" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-npm:
    name: Publish to npm
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync npm package version from pyproject.toml
        run: python3 tools/sync_npm_version.py

      - name: Install (no-op for zero-dep package, runs npm test)
        working-directory: npm
        run: npm test

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
