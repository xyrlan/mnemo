name: Release

on:
  push:
    tags: ["v*"]

jobs:
  publish-pypi:
    name: Publish to PyPI
    runs-on: ubuntu-latest
    environment: pypi
    permissions:
      id-token: write  # for trusted publishing (optional alt to API token)
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Verify tag matches pyproject.toml version
        run: |
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          PYPROJECT_VERSION=$(grep '^version' pyproject.toml | head -1 | cut -d'"' -f2)
          if [ "$TAG_VERSION" != "$PYPROJECT_VERSION" ]; then
            echo "Tag $GITHUB_REF_NAME does not match pyproject.toml version $PYPROJECT_VERSION"
            exit 1
          fi

      - name: Install build tooling
        run: python -m pip install --upgrade build

      - name: Build sdist + wheel
        run: python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          password: ${{ secrets.PYPI_API_TOKEN }}
          packages-dir: dist/

  build-binaries:
    name: Binary — ${{ matrix.target }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: macos-14,      target: darwin-arm64 }
          - { os: macos-13,      target: darwin-x64 }
          - { os: ubuntu-latest, target: linux-x64 }
          - { os: windows-latest, target: win-x64 }
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install build tooling
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[build]"
      - name: Build (onedir — see tools/mnemo.spec for why not onefile)
        run: pyinstaller tools/mnemo.spec --distpath dist/bin --workpath build/pyi --noconfirm

      # Smoke-test before publishing: a binary that cannot scaffold a vault is
      # worse than no binary, and `init` is what exercises the bundled
      # templates that PyInstaller has to collect explicitly.
      - name: Smoke test
        shell: bash
        run: |
          BIN=dist/bin/mnemo/mnemo
          [ "${{ runner.os }}" = "Windows" ] && BIN=dist/bin/mnemo/mnemo.exe
          "$BIN" --version
          mkdir -p /tmp/smoke && cd /tmp/smoke && git init -q .
          "$GITHUB_WORKSPACE/$BIN" init --project --yes --quiet
          "$GITHUB_WORKSPACE/$BIN" status
          test -f .mnemo/HOME.md || { echo "::error::templates missing from the bundle"; exit 1; }

      - name: Package
        shell: bash
        run: |
          cd dist/bin
          tar -czf "mnemo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" mnemo
          shasum -a 256 "mnemo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz" \
            > "mnemo-${{ github.ref_name }}-${{ matrix.target }}.tar.gz.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: binary-${{ matrix.target }}
          path: |
            dist/bin/*.tar.gz
            dist/bin/*.sha256

  publish-binaries:
    name: Attach binaries to the release
    runs-on: ubuntu-latest
    needs: build-binaries
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: binary-*
          merge-multiple: true
          path: artifacts
      - name: Upload to the GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release create "${{ github.ref_name }}" artifacts/* --title "${{ github.ref_name }}" --generate-notes --repo "$GITHUB_REPOSITORY" || gh release upload "${{ github.ref_name }}" artifacts/* --clobber --repo "$GITHUB_REPOSITORY"

  publish-npm:
    name: Publish to npm
    runs-on: ubuntu-latest
    needs: publish-pypi
    steps:
      - uses: actions/checkout@v4

      - name: Set up Node 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          registry-url: "https://registry.npmjs.org"

      - name: Sync npm package version from pyproject.toml
        run: python3 tools/sync_npm_version.py

      - name: Install (no-op for zero-dep package, runs npm test)
        working-directory: npm
        run: npm test

      - name: Publish to npm
        working-directory: npm
        run: npm publish --access public
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
