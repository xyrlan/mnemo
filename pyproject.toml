[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "mnemo-claude"
version = "1.3.0"
description = "The Obsidian that populates itself so your Claude never forgets."
readme = "README.md"
requires-python = ">=3.8"
license = { text = "MIT" }
authors = [{ name = "xyrlan" }]
dependencies = []  # stdlib only — this is intentional

[project.optional-dependencies]
dev = [
    "pytest>=7.0",
    "pytest-cov>=4.0",
    # Only to let the tests read .github/workflows/*.yml. Without it the
    # release-ordering tests would importorskip themselves into never running.
    "PyYAML>=6.0",
]
# Only needed to produce the standalone binaries; never a runtime dependency.
# mnemo itself stays stdlib-only, which is what makes freezing it viable.
build = [
    "pyinstaller>=6.0",
]

[project.scripts]
mnemo = "mnemo.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mnemo = ["templates/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -m 'not recall'"
markers = [
    "recall: live retrieval regression suite (opt-in; runs against a real vault)",
    "real_spawn: the test exercises a detached-spawn function itself (opts out of the autouse no-spawn guard)",
]

[tool.coverage.run]
branch = true
source = ["src/mnemo"]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "if __name__ == .__main__.:",
    "raise NotImplementedError",
]
